version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
