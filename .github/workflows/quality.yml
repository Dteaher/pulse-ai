name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - run: python -m pip install -r backend/requirements-dev.lock.txt
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          LLM_PROVIDER: mock
          API_LIMITS_ENABLED: 'false'
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements-dev.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', package-manager-cache: false }
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
        env: { PULSE_TEST_CHANNEL: chromium }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', package-manager-cache: false }
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: python scripts/check-secrets.py
      - run: python -m pip_audit -r backend/requirements-dev.lock.txt --no-deps --disable-pip
      - run: python -m bandit -r backend/app -ll -q
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm audit --audit-level moderate
        working-directory: frontend
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
        env:
          SITE_ADDRESS: http://localhost
          PULSE_ACCESS_TOKEN: ci-only-mock-workspace-code-not-a-real-secret
      - name: HTTP and access smoke
        run: |
          python scripts/container-smoke.py
      - name: Stop containers
        if: always()
        run: docker compose down
        env:
          PULSE_ACCESS_TOKEN: ci-only-mock-workspace-code-not-a-real-secret
